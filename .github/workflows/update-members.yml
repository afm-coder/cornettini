name: Update Club Member Count


on:

  # ======================================================
  # AUTOMATIC MEMBER COUNT CHECK
  #
  # Runs once every hour.
  # ======================================================

  schedule:

    - cron: "0 * * * *"


  # ======================================================
  # MANUAL RUN
  #
  # Keeps the "Run workflow" button available.
  # ======================================================

  workflow_dispatch:


# ========================================================
# GIVE GITHUB ACTIONS PERMISSION TO UPDATE members.json
# ========================================================

permissions:

  contents: write


# ========================================================
# JOB
# ========================================================

jobs:

  update-members:

    runs-on:
      ubuntu-latest


    steps:


      # ==================================================
      # CHECK OUT REPOSITORY
      # ==================================================

      - name:
          Checkout repository

        uses:
          actions/checkout@v4


      # ==================================================
      # SET UP NODE.JS
      # ==================================================

      - name:
          Set up Node.js

        uses:
          actions/setup-node@v4

        with:

          node-version:
            24


      # ==================================================
      # UPDATE MEMBER COUNT
      # ==================================================

      - name:
          Update member count

        run:
          node update-members.js


      # ==================================================
      # CHECK WHETHER members.json CHANGED
      # ==================================================

      - name:
          Check for changes

        id:
          changes

        run: |

          if git diff --quiet members.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # ==================================================
      # COMMIT NEW MEMBER COUNT
      # ==================================================

      - name:
          Commit updated member count

        if:
          steps.changes.outputs.changed == 'true'

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add members.json

          git commit -m "Update club member count"

          git push
