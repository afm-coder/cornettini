<!-- =================================================
     CLUB RADIO
     ================================================= -->

<div class="radio">


    <!-- TITLE -->

    <div class="section-title">

        🎵 Club Radio 🎵

    </div>


    <!-- =================================================
         HIDDEN YOUTUBE PLAYER

         THIS IS THE SAME METHOD FROM
         YOUR ORIGINAL WORKING CODE.
         ================================================= -->

    <iframe
        width="0"
        height="0"
        style="border: 0; display: none;"
        class="club-player"
        id="clubplayer"
        allow="autoplay"
    ></iframe>


    <!-- =================================================
         PLAY / STOP BUTTON

         INLINE ONCLICK IS INTENTIONAL.
         THIS IS HOW YOUR ORIGINAL CODE WORKED.
         ================================================= -->

    <button
        class="radio-button"
        id="radioButton"
        data-state="off"
        type="button"

        onclick="
            var p = document.getElementById('clubplayer');

            if (this.getAttribute('data-state') == 'off') {

                p.src = 'https://www.youtube.com/embed/8F2s8ivKXNY?autoplay=1';

                this.innerHTML = '⟳ Restart';

                this.setAttribute('data-state', 'restart');

            }

            else if (this.getAttribute('data-state') == 'restart') {

                p.src = '';

                this.innerHTML = '▶ Play Music';

                this.setAttribute('data-state', 'off');

            }
        "
    >

        ▶ Play Music

    </button>


</div>
